<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>祈愿猫 · 社交小程序 · He 天波 · 作品集</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='3' fill='%2323231F'/%3E%3Ctext x='16' y='22.5' font-family='Arial,sans-serif' font-size='17' fill='%23F7F7F4' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@200;300;400;500;600&display=swap">
<style>
  :root{--paper:#F7F7F4;--ink:#23231F;--stone:#7B7B73;--line:#E5E4DE;--soft:#EFEFEA;--font-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;scrollbar-gutter:stable;}
  body{background:radial-gradient(120% 90% at 50% -12%, #FFFFFF 0%, #FAFAF7 50%, #ECE9E2 100%);color:var(--ink);font-family:var(--font-sans);font-weight:300;font-size:15px;line-height:1.8;-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--ink);color:var(--paper);}
  a{color:inherit;}
  .crumbs{
    position:sticky;top:0;z-index:50;
    background:rgba(10,10,10,.82);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);mask-image:linear-gradient(to right, transparent, black 8%, black 92%, transparent);-webkit-mask-image:linear-gradient(to right, transparent, black 8%, black 92%, transparent);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .crumbs-in{
    max-width:1120px;margin:0 auto;padding:0 26px;
    height:56px;display:flex;align-items:center;gap:10px;
    font-size:13px;letter-spacing:.05em;color:rgba(255,255,255,.55);
  }
  .crumbs .back{
    display:inline-flex;align-items:center;gap:3px;
    text-decoration:none;color:#111;
    padding:3px 12px;margin-right:8px;
    border:none;border-radius:999px;background:rgba(255,255,255,.9);
    transition:background .2s,color .2s;
  }
  .crumbs .back:hover{background:rgba(255,255,255,.6);color:#111;}
  .crumbs a{text-decoration:none;color:rgba(255,255,255,.55);transition:color .2s;}
  .crumbs a:hover{color:#fff;}
  .crumbs .sep{color:rgba(255,255,255,.25);}
  .crumbs .cur{color:#fff;font-weight:400;}
  .head{max-width:1120px;margin:0 auto;padding:70px 26px 50px;}
  .eyebrow{font-size:12px;letter-spacing:.2em;color:var(--stone);margin-bottom:16px;}
  .head h1{font-weight:600;font-size:clamp(28px,3.6vw,42px);letter-spacing:.04em;line-height:1.2;}
  .head .meta{margin-top:14px;font-size:13.5px;color:var(--stone);letter-spacing:.06em;}
  .head .desc{margin-top:26px;max-width:64ch;color:var(--stone);font-size:15px;}
  .head .desc b{color:var(--ink);font-weight:400;}
  .shots{max-width:1120px;margin:0 auto;padding:0 26px 30px;display:flex;flex-direction:column;gap:24px;}
  .shots figure{margin:0;}
  .shots img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:2px;background:var(--soft);cursor:zoom-in;}
  .foot{max-width:1120px;margin:0 auto;padding:30px 26px 90px;display:flex;justify-content:center;align-items:center;gap:16px;border-top:1px solid var(--line);}
  .foot a{text-decoration:none;font-size:18px;letter-spacing:.1em;color:var(--ink);background:transparent;border:1px solid var(--stone);border-radius:999px;padding:10px 24px;transition:background .2s,color .2s;display:inline-flex;align-items:center;gap:4px;}.foot a svg{width:18px;height:18px;}
  .foot a:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  @media (max-width:720px){
    .head{padding:46px 20px 34px;}
    .shots{padding:0 20px 16px;gap:16px;}
    .foot{flex-direction:column;padding:26px 20px 64px;}
    .crumbs-in{padding:0 16px;font-size:12.5px;}
    .crumbs .back span{display:none;}
  }
  .lb{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;}
  .lb.open{display:flex;}
  .lb img{width:70vw;max-width:70vw;max-height:88vh;object-fit:contain;box-shadow:0 12px 48px rgba(0,0,0,.4);user-select:none;}
  .lb .lb-btn{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;}
  .lb .lb-btn:hover{background:rgba(255,255,255,.28);}
  .lb .lb-prev{left:24px;}
  .lb .lb-next{right:24px;}
  .lb .lb-close{position:absolute;top:18px;right:22px;width:64px;height:64px;border-radius:50%;background:transparent;border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .lb .lb-close:hover{opacity:.7;}
  .lb .lb-count{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.75);font-size:13px;letter-spacing:.1em;}
  @media (max-width:720px){.lb .lb-prev{left:8px;}.lb .lb-next{right:8px;}}
  .to-top{position:fixed;right:48px;bottom:48px;z-index:90;width:46px;height:46px;border-radius:50%;background:var(--paper);border:1px solid var(--line);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(35,35,31,.08);transition:background .2s,color .2s,opacity .2s;opacity:0;pointer-events:none;}
  .to-top.show{opacity:1;pointer-events:auto;}
  .to-top:hover{background:var(--ink);color:var(--paper);}
  @media (max-width:720px){.to-top{right:16px;bottom:16px;}}
</style>
</head>
<body>

<header class="crumbs">
  <div class="crumbs-in">
    <a class="back" href="../index.html#ui" title="返回 UI设计列表">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span>返回</span>
    </a>
    <a href="../index.html#profile">首页</a>
    <span class="sep">/</span>
    <a href="../index.html#ui">UI设计</a>
    <span class="sep">/</span>
    <span class="cur">祈愿猫 · 社交小程序</span>
  </div>
</header>

<section class="head">
  <div class="eyebrow">UI Design · Social App</div>
  <h1>祈愿猫 · 社交小程序</h1>
  <div class="meta">塔罗玄学社交应用</div>
  <p class="desc">围绕<b>塔罗占卜与许愿社交</b>场景设计的产品，覆盖<b>卡牌占卜、许愿、还愿、塔罗圈、商城消息、个人中心</b>等核心模块，以深色星空与猫系视觉语言，兼顾信息层级与仪式感动效。</p>
</section>

<main class="shots">
  <figure><img src="../assets/work/qiyuanmao/01.png" alt="封面"></figure>
  <figure><img src="../assets/work/qiyuanmao/02.png" alt="项目概览"></figure>
  <figure><img src="../assets/work/qiyuanmao/03.png" alt="设计亮点"></figure>
  <figure><img src="../assets/work/qiyuanmao/04.png" alt="用户体系"></figure>
  <figure><img src="../assets/work/qiyuanmao/05.png" alt="卡牌占卜"></figure>
  <figure><img src="../assets/work/qiyuanmao/06.png" alt="许愿"></figure>
  <figure><img src="../assets/work/qiyuanmao/07.png" alt="还愿"></figure>
  <figure><img src="../assets/work/qiyuanmao/08.png" alt="塔罗圈"></figure>
  <figure><img src="../assets/work/qiyuanmao/09.png" alt="商城消息"></figure>
  <figure><img src="../assets/work/qiyuanmao/10.png" alt="个人中心"></figure>
</main>

<footer class="foot">
  <a href="../index.html#ui">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    返回
  </a>
</footer>

<button class="to-top" id="toTop" aria-label="回到顶部">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>
<div class="lb" id="lb">
  <button class="lb-close" id="lbClose" aria-label="关闭">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button class="lb-btn lb-prev" id="lbPrev" aria-label="上一张">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <img id="lbImg" src="" alt="">
  <button class="lb-btn lb-next" id="lbNext" aria-label="下一张">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </button>
  <div class="lb-count" id="lbCount"></div>
</div>

<script>
(function(){
  "use strict";
  try{
    var imgs = Array.prototype.slice.call(document.querySelectorAll(".shots img"));
    var lb = document.getElementById("lb");
    var lbImg = document.getElementById("lbImg");
    var lbCount = document.getElementById("lbCount");
    var idx = 0;
    function show(i){idx=(i+imgs.length)%imgs.length;lbImg.src=imgs[idx].src;lbImg.alt=imgs[idx].alt||"";lbCount.textContent=(idx+1)+" / "+imgs.length;}
    function open(i){show(i);lb.classList.add("open");document.body.style.overflow="hidden";}
    function close(){lb.classList.remove("open");document.body.style.overflow="";}
    imgs.forEach(function(img,i){img.addEventListener("click",function(){open(i);});});
    document.getElementById("lbClose").addEventListener("click",close);
    document.getElementById("lbPrev").addEventListener("click",function(e){e.stopPropagation();show(idx-1);});
    document.getElementById("lbNext").addEventListener("click",function(e){e.stopPropagation();show(idx+1);});
    lb.addEventListener("click",function(e){if(e.target===lb)close();});
    window.addEventListener("keydown",function(e){if(!lb.classList.contains("open"))return;if(e.key==="Escape")close();else if(e.key==="ArrowLeft")show(idx-1);else if(e.key==="ArrowRight")show(idx+1);});
    var lock=0;
    lb.addEventListener("wheel",function(e){if(!lb.classList.contains("open"))return;e.preventDefault();if(Date.now()<lock)return;if(Math.abs(e.deltaY)<12)return;lock=Date.now()+600;show(e.deltaY>0?idx+1:idx-1);},{passive:false});
    var toTop=document.getElementById("toTop");
    window.addEventListener("scroll",function(){if(window.scrollY>400)toTop.classList.add("show");else toTop.classList.remove("show");},{passive:true});
    toTop.addEventListener("click",function(){window.scrollTo({top:0,behavior:"smooth"});});
  }catch(err){}
})();
</script>

</body>
</html>
