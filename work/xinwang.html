<style>

    --paper:#F7F7F4;
    --ink:#23231F;
    --stone:#7B7B73;
    --line:#E5E4DE;
    --soft:#EFEFEA;
    --font-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;scrollbar-gutter:stable;}
  body{
    background:radial-gradient(120% 90% at 50% -12%, #FFFFFF 0%, #FAFAF7 50%, #ECE9E2 100%);
    color:var(--ink);
    font-family:var(--font-sans);
    font-weight:300;
    font-size:15px;

    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--ink);color:var(--paper);}
  a{color:inherit;}

  /* ===== 顶部面包屑 ===== */
  .crumbs{
    position:sticky;top:0;z-index:50;
    background:rgba(20,20,20,.55);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);mask-image:linear-gradient(to right, transparent, black 8%, black 92%, transparent);-webkit-mask-image:linear-gradient(to right, transparent, black 8%, black 92%, transparent);

  }
  .crumbs-in{
    max-width:1120px;margin:0 auto;padding:0 26px;
    height:56px;display:flex;align-items:center;gap:10px;
    font-size:13px;letter-spacing:.05em;color:rgba(255,255,255,.55);
  }
  .crumbs .back{
    display:inline-flex;align-items:center;gap:3px;
    text-decoration:none;color:#111;
    padding:3px 12px;margin-right:8px;
    border:none;border-radius:999px;background:rgba(255,255,255,.9);
    transition:background .2s,color .2s;
  }
  .crumbs .back:hover{background:rgba(255,255,255,.6);color:#111;}
  .crumbs a{text-decoration:none;color:rgba(255,255,255,.55);transition:color .2s;}
  .crumbs a:hover{color:#fff;}
  .crumbs .sep{color:rgba(255,255,255,.25);}
  .crumbs .cur{color:#fff;font-weight:400;}

  /* ===== 项目头 ===== */

  .ui-sub .eyebrow{margin-bottom:10px;}
  .ui-sub h2{font-weight:500;font-size:clamp(22px,2.6vw,30px);letter-spacing:.04em;}

  .ui-cols img{

  }

  .lb .lb-next{right:24px;}

    display:flex;align-items:center;justify-content:center;

  <button class="lb-btn lb-next" id="lbNext" aria-label="下一张">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </button>
  <div class="lb-count" id="lbCount"></div>
</div>

<script>
(function(){
  "use strict";
  try{
    var imgs = Array.prototype.slice.call(document.querySelectorAll(".shots img"));
    var lb = document.getElementById("lb");
    var lbImg = document.getElementById("lbImg");
    var lbCount = document.getElementById("lbCount");
    var idx = 0;
    function show(i){
      idx = (i + imgs.length) % imgs.length;
      lbImg.src = imgs[idx].src;
      lbImg.alt = imgs[idx].alt || "";
      lbCount.textContent = (idx+1) + " / " + imgs.length;
    }
    function open(i){
      show(i);
      lb.classList.add("open");
      document.body.style.overflow = "hidden";
    }
    function close(){
      lb.classList.remove("open");
      document.body.style.overflow = "";
    }
    imgs.forEach(function(img, i){
      img.addEventListener("click", function(){ open(i); });
    });
    document.getElementById("lbClose").addEventListener("click", close);
    document.getElementById("lbPrev").addEventListener("click", function(e){ e.stopPropagation(); show(idx-1); });
    document.getElementById("lbNext").addEventListener("click", function(e){ e.stopPropagation(); show(idx+1); });
    lb.addEventListener("click", function(e){ if(e.target === lb) close(); });
    window.addEventListener("keydown", function(e){
      if(!lb.classList.contains("open")) return;
      if(e.key === "Escape") close();
      else if(e.key === "ArrowLeft") show(idx-1);
      else if(e.key === "ArrowRight") show(idx+1);
    });
    var lbWheelLock = 0;
    lb.addEventListener("wheel", function(e){
      if(!lb.classList.contains("open")) return;
      e.preventDefault();
      if(Date.now() < lbWheelLock) return;
      if(Math.abs(e.deltaY) < 12) return;
      lbWheelLock = Date.now() + 600;
      show(e.deltaY > 0 ? idx+1 : idx-1);
    }, {passive:false});

    var toTop = document.getElementById("toTop");
    window.addEventListener("scroll", function(){
      if(window.scrollY > 400) toTop.classList.add("show");
      else toTop.classList.remove("show");
    }, {passive:true});
    toTop.addEventListener("click", function(){
      window.scrollTo({top:0, behavior:"smooth"});
    });
  }catch(err){}
})();
</script>
