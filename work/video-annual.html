<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AE制作运营活动视频 · He 天波 · 作品集</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='3' fill='%2323231F'/%3E%3Ctext x='16' y='22.5' font-family='Arial,sans-serif' font-size='17' fill='%23F7F7F4' text-anchor='middle'%3EH%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@200;300;400;500;600&display=swap">
<style>
  :root{
    --paper:#F7F7F4;
    --ink:#23231F;
    --stone:#7B7B73;
    --line:#E5E4DE;
    --soft:#EFEFEA;
    --font-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;scrollbar-gutter:stable;}
  body{
    background:radial-gradient(120% 90% at 50% -12%, #FFFFFF 0%, #FAFAF7 50%, #ECE9E2 100%);
    color:var(--ink);
    font-family:var(--font-sans);
    font-weight:300;
    font-size:15px;
    line-height:1.8;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--ink);color:var(--paper);}
  a{color:inherit;}

  .crumbs{
    position:sticky;top:0;z-index:50;
    background:rgba(10,10,10,.82);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);mask-image:linear-gradient(to right, transparent, black 8%, black 92%, transparent);-webkit-mask-image:linear-gradient(to right, transparent, black 8%, black 92%, transparent);
    border-bottom:1px solid rgba(255,255,255,.08);
  }
  .crumbs-in{
    max-width:1120px;margin:0 auto;padding:0 26px;
    height:56px;display:flex;align-items:center;gap:10px;
    font-size:13px;letter-spacing:.05em;color:rgba(255,255,255,.55);
  }
  .crumbs .back{
    display:inline-flex;align-items:center;gap:3px;
    text-decoration:none;color:#111;
    padding:3px 12px;margin-right:8px;
    border:none;border-radius:999px;background:rgba(255,255,255,.9);
    transition:background .2s,color .2s;
  }
  .crumbs .back:hover{background:rgba(255,255,255,.6);color:#111;}
  .crumbs a{text-decoration:none;color:rgba(255,255,255,.55);transition:color .2s;}
  .crumbs a:hover{color:#fff;}
  .crumbs .sep{color:rgba(255,255,255,.25);}
  .crumbs .cur{color:#fff;font-weight:400;}

  .head{
    max-width:1120px;margin:0 auto;padding:70px 26px 40px;
  }
  .eyebrow{font-size:12px;letter-spacing:.2em;color:var(--stone);margin-bottom:16px;}
  .head h1{font-weight:600;font-size:clamp(28px,3.6vw,42px);letter-spacing:.04em;line-height:1.2;}
  .head .meta{margin-top:14px;font-size:13.5px;color:var(--stone);letter-spacing:.06em;}
  .head .desc{margin-top:26px;max-width:64ch;color:var(--stone);font-size:15px;}
  .head .desc b{color:var(--ink);font-weight:400;}

  .video-wrap{
    max-width:1120px;margin:0 auto;
    padding:0 26px 60px;
    display:flex;justify-content:center;
  }
  .video-wrap video{
    display:block;width:auto;max-width:100%;
    max-height:80vh;
    border:none;border-radius:6px;
    background:transparent;
  }
  .video-box{position:relative;display:inline-block;}
  .video-box .big-play{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:60px;height:60px;border-radius:50%;
    background:rgba(255,255,255,.1);backdrop-filter:blur(20px);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;z-index:2;
    transition:transform .2s,opacity .2s;
    border:none;
  }
  .video-box .big-play:hover{transform:translate(-50%,-50%) scale(1.06);}
  .video-box.playing .big-play{opacity:0;pointer-events:none;}
  .video-box .big-play svg{width:24px;height:24px;margin-left:4px;fill:#fff;}

  .foot{
    max-width:1120px;margin:0 auto;padding:30px 26px 90px;
    display:flex;justify-content:center;align-items:center;gap:16px;
    border-top:1px solid var(--line);
  }
  .foot a{
    text-decoration:none;font-size:18px;letter-spacing:.1em;color:var(--ink);
    background:transparent;border:1px solid var(--stone);border-radius:999px;
    padding:10px 24px;
    transition:background .2s,color .2s;
    display:inline-flex;align-items:center;gap:4px;
  }
  .foot a svg{width:18px;height:18px;}
  .foot a:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  @media (max-width:720px){
    .head{padding:46px 20px 28px;}
    .video-wrap{padding:0 20px 40px;}
    .foot{flex-direction:column;padding:26px 20px 64px;}
    .crumbs-in{padding:0 16px;font-size:12.5px;}
    .crumbs .back span{display:none;}
  }

  .to-top{
    position:fixed;right:48px;bottom:48px;z-index:90;
    width:46px;height:46px;border-radius:50%;
    background:var(--paper);border:1px solid var(--line);
    color:var(--ink);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 16px rgba(35,35,31,.08);
    transition:background .2s,color .2s,opacity .2s;
    opacity:0;pointer-events:none;
  }
  .to-top.show{opacity:1;pointer-events:auto;}
  .to-top:hover{background:var(--ink);color:var(--paper);}
  @media (max-width:720px){
    .to-top{right:16px;bottom:16px;}
  }
</style>
</head>
<body>

<header class="crumbs">
  <div class="crumbs-in">
    <a class="back" href="../index.html#video" title="返回 视频制作列表">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span>返回</span>
    </a>
    <a href="../index.html#profile">首页</a>
    <span class="sep">/</span>
    <a href="../index.html#video">视频制作</a>
    <span class="sep">/</span>
    <span class="cur">AE制作运营活动视频</span>
  </div>
</header>

<section class="head">
  <div class="eyebrow">Video · Product Film</div>
  <h1>AE制作运营活动视频</h1>
  <div class="meta">AE 制作伪 3D 视频</div>
  <p class="desc">
    成都大运会期间的移动<b>"移起助力、青春赛场"</b>运营主题活动，以完成各个赛事项目为任务线，获取话费奖励为目标。
    <b>采用 AE 制作的视频素材与效果。</b>
  </p>
</section>

<section class="video-wrap">
  <div class="video-box" id="vbox">
    <video id="vplayer" playsinline preload="metadata">
      <source src="../assets/work/video/annual.mp4" type="video/mp4">
      您的浏览器不支持视频播放。
    </video>
    <button class="big-play" id="bigPlay" aria-label="播放">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>
    </button>
  </div>
</section>

<footer class="foot">
  <a href="../index.html#video">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    返回
  </a>
</footer>

<button class="to-top" id="toTop" aria-label="回到顶部">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
</button>

<script>
(function(){
  "use strict";
  try{
    var vbox = document.getElementById("vbox");
    var vplayer = document.getElementById("vplayer");
    var bigPlay = document.getElementById("bigPlay");
    bigPlay.addEventListener("click", function(){
      vplayer.play();
      vbox.classList.add("playing");
      vplayer.controls = true;
    });
    vplayer.addEventListener("ended", function(){
      vbox.classList.remove("playing");
      vplayer.controls = false;
    });

    var toTop = document.getElementById("toTop");
    window.addEventListener("scroll", function(){
      if(window.scrollY > 400) toTop.classList.add("show");
      else toTop.classList.remove("show");
    }, {passive:true});
    toTop.addEventListener("click", function(){ window.scrollTo({top:0, behavior:"smooth"}); });
  }catch(err){}
})();
</script>

</body>
</html>
